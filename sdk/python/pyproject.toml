[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cage-plugin-sdk"
version = "0.1.0"
description = "Python SDK for Cage validation plugins (versioned JSON IPC protocol v1)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "cuihairu", email = "chuihairu@gmail.com" }]
keywords = ["cage", "game-config", "validation", "plugin"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Build Tools",
]

[project.urls]
Homepage = "https://github.com/cuihairu/cage"
Documentation = "https://cuihairu.github.io/cage/plugins"

[tool.setuptools]
packages = ["cage_sdk"]
