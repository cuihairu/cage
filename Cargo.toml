[workspace]
resolver = "2"
members = [
    "crates/cage-core",
    "crates/cage-source-excel",
    "crates/cage-source-csv",
    "crates/cage-source-json",
    "crates/cage-source-http",
    "crates/cage-source-db",
    "crates/cage-source-sheets",
    "crates/cage-source-yaml",
    "crates/cage-source-msgpack",
    "crates/cage-target-json",
    "crates/cage-target-msgpack",
    "crates/cage-target-proto",
    "crates/cage-target-flatbuffers",
    "crates/cage-target-jsonschema",
    "crates/cage-target-csv",
    "crates/cage-target-cs",
    "crates/cage-target-py",
    "crates/cage-target-lua",
    "crates/cage-target-ts",
    "crates/cage-target-cpp",
    "crates/cage-target-go",
    "crates/cage-target-java",
    "crates/cage-target-template",
    "crates/cage-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/cuihairu/cage"
authors = ["cuihairu"]
categories = ["command-line-utilities", "development-tools", "serialization"]
keywords = ["config", "validation", "game-dev", "compiler", "schema"]
description = "Game Configuration Compiler, Validation & Transformation Framework"

[workspace.dependencies]
# Core
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
serde_path_to_error = "0.1"
indexmap = { version = "2.0", features = ["serde"] }
regex = "1.10"

# CLI
clap = { version = "4.5", features = ["derive"] }
tiny_http = "0.12"
ureq = "2"
# §45 HTTP source pagination: RFC 3986 relative-reference resolution for
# `Link: rel="next"` targets (already in the tree via ureq)
url = "2"
console = "0.15"

# Source adapters
# 0.25+ exposes merged-cell regions (T2.4); 0.36 unified the API across formats
calamine = "0.36"
csv = "1.3"
toml = "0.8"

# Hashing & deterministic
blake3 = "1.5"
# Web editor save-back: per-source-file sha256 revision for the conflict
# check on multi-file (directory) schema_path projects
sha2 = "0.10"
base64 = "0.22"
# §47 A6 signed bundles: ed25519 over bundle file bytes; rand_core+getrandom
# feeds SigningKey::generate for `cage registry keygen`
ed25519-dalek = { version = "=2.2.0", features = ["rand_core"] }
rand_core = { version = "0.6.4", features = ["getrandom"] }
# Deterministic tar bundles (§47 A series): zero-dep pure-Rust archive
# read/write; determinism comes from headers we set ourselves
tar = "0.4"
# Bundles are small config artifacts — level 19 (max) trades compression
# time for ratio; determinism is per pinned zstd-sys/build
zstd = "0.13"

rmp = "0.8"
rmpv = "1.3"

# Template Target engine (§22 Template Target, G series)
tera = "1"

# Remote Source backends (§45, S2) — pure-Rust protocol clients
mysql = "28"
postgres = "0.19"

# AI 助手 (MCP) server — official Model Context Protocol Rust SDK;
# `server`/`macros` build the stdio JSON-RPC transport (features/quarantine:
# the MCP stack lands only in cage-cli, no other crate pulls it in)
rmcp = { version = "3.5.1", default-features = false, features = [
    "server",
    "macros",
    "schemars",
    "transport-io",
] }
tokio = { version = "1", features = ["rt", "io-std", "macros"] }

# Testing
tempfile = "3.10"

[patch.crates-io]
tiny_http = { path = "vendor/tiny_http" }

# Lint levels live in each crate root as inner attributes
# (`#![warn(clippy::all, clippy::pedantic)]` + scoped allows): the
# `[workspace.lints]` table makes cargo swallow `-- -D warnings` and, on this
# toolchain, suppresses lint output entirely — both fatal for the CI gate.

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = "z"

[profile.dev]
debug = true

[profile.ci]
inherits = "release"
debug = false
