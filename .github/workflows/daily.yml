# Cage 每日构建——每日全量验证（Rust 测试 + release 构建 + 文档构建），
# 捕捉工具链与依赖漂移；与 CI 门禁同规则但更全（含 release profile、API 文档）。
name: Daily Build

on:
  schedule:
    # UTC 02:37 = 北京时间 10:37，避开整点高峰
    - cron: '37 2 * * *'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTDOCFLAGS: -D warnings

jobs:
  # 探测是否包含 Rust 工作区（hashFiles 仅 step 级可用）
  detect:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.detect.outputs.rust }}
    steps:
      - uses: actions/checkout@v5
      - id: detect
        run: echo "rust=$([ -f Cargo.toml ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  rust:
    name: Rust (test + release build)
    needs: detect
    if: needs.detect.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format check
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: API docs
        run: cargo doc --workspace --no-deps --locked
      - name: Test (all crates)
        run: cargo test --workspace --locked
      - name: Release build
        run: cargo build --workspace --release --locked

  docs:
    name: Docs build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build docs
        run: npm run docs:build
