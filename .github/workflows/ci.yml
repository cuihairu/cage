# Cage CI——门禁：格式、lint、API 文档、全测试绿
# Rust 工作区存在时才运行 Rust 任务（Cargo.toml 缺失时跳过，不阻塞纯文档提交）。
name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  # 探测是否包含 Rust 工作区（hashFiles 仅 step 级可用）
  detect:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.detect.outputs.rust }}
    steps:
      - uses: actions/checkout@v5
      - id: detect
        run: echo "rust=$([ -f Cargo.toml ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  fmt:
    name: Rustfmt
    needs: detect
    if: needs.detect.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: Clippy
    needs: detect
    if: needs.detect.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  rustdoc:
    name: Rustdoc
    needs: detect
    if: needs.detect.outputs.rust == 'true'
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --no-deps --locked

  test:
    name: Test (all crates)
    needs: detect
    if: needs.detect.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run all tests
        run: cargo test --workspace --locked
      - name: Build workspace
        run: cargo build --workspace --locked

  # 示例工程防烂腿：examples/run.sh 端到端跑一遍
  # （check/build/gen/坏数据 E1601 断言），示例烂了这里就红。
  example:
    name: Example project
    needs: detect
    if: needs.detect.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run end-to-end example
        run: bash examples/run.sh
      - name: Compile generated proto files
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q protobuf-compiler
          protoc --proto_path=examples/game-config/build/client/proto \
            --descriptor_set_out=/dev/null \
            examples/game-config/build/client/proto/*.proto

  web-smoke:
    name: Web editor smoke
    needs: detect
    if: needs.detect.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run web editor smoke (edit → validate → save → build)
        run: bash examples/web-smoke.sh

  # 覆盖率：llvm-cov 出 lcov 上传 Codecov。tokenless 走 OIDC
  # （codecov-action use_oidc，无需仓库 secret；受保护分支下裸
  # tokenless 上传会被 Codecov 以 "Token required" 拒绝）。
  # 上传尽力而为（fail_ci_if_error: false）：Codecov 限流/故障不挡合入；
  # 报告生成（llvm-cov 步）失败仍会失败本 job。
  coverage:
    name: Coverage
    needs: detect
    if: needs.detect.outputs.rust == 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          key: coverage
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - name: Generate lcov report
        run: cargo llvm-cov --workspace --all-features --locked --lcov --output-path lcov.info
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: lcov.info
          flags: rust
          use_oidc: true
          fail_ci_if_error: false
