<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1170" viewBox="0 0 1200 1170" role="img" aria-labelledby="title desc" xml:lang="zh-CN">
<title id="title">Cage · 配置编译与验证框架架构</title>
<desc id="desc">Cage 把分散、异构、面向人的游戏配置编译成经过验证、确定性构建的运行时资产。数据流自上而下：编写源（Excel/CSV/JSON/YAML/HTTP/MySQL/PostgreSQL/Google Sheets）经 Source Adapter（cage-source-*，只读解析不做业务校验）进入统一 Canonical Model；随后八级验证流水线（L0 Syntax ~ L7 Game Rules），经 Normalize/IR 交给 Target Generators（cage-target-*），产出数据资产（JSON/CSV/MsgPack）、代码绑定（C#/Python/Lua/TS/JS/C++/Go/Java）与契约/模板（Protobuf/JSON Schema/FlatBuffers/Template），最终生成 Manifest/Hash 实现确定性构建。横切能力：CLI（check --level / compile / migrate / lsp）、诊断一等公民（错误码+定位+修复提示，供 CLI/Web UI/IDE）、Profile（client/server）与声明式数据迁移（cage migrate）。虚线为横切/控制关系，实线为数据流。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="context-stroke"/></marker></defs>
<style>text{font-family:Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif;fill:#172b4d}.title{font-size:30px;font-weight:700}.name{font-size:22px;font-weight:700}.body{font-size:17px;fill:#435570}.small{font-size:15px;fill:#52647b}.label{font-size:15px;fill:#435570;paint-order:stroke;stroke:#f8fafc;stroke-width:5px;stroke-linejoin:round}.edge{fill:none;stroke-linejoin:round}.control{stroke-dasharray:7 5}</style>
<rect width="1200" height="1170" rx="20" fill="#f8fafc"/>
<text x="40" y="48" class="title" text-anchor="start">Cage · 配置编译与验证框架</text>
<text x="40" y="80" class="body" text-anchor="start">编写源 → Source Adapter → Canonical Model → 八级验证流水线 → Normalize/IR → Target Generators → Manifest/Hash</text>

<path d="M600 190 V220" fill="none" stroke="#f8fafc" stroke-width="9"/>
<path id="src-adapter" data-from="sources" data-to="adapters" d="M600 190 V220" class="edge" style="stroke:#475569;stroke-width:2" marker-end="url(#arrow)"/>
<path d="M600 300 V330" fill="none" stroke="#f8fafc" stroke-width="9"/>
<path id="adapter-model" data-from="adapters" data-to="canonical" d="M600 300 V330" class="edge" style="stroke:#475569;stroke-width:2" marker-end="url(#arrow)"/>
<path d="M600 400 V430" fill="none" stroke="#f8fafc" stroke-width="9"/>
<path id="model-validate" data-from="canonical" data-to="validation" d="M600 400 V430" class="edge" style="stroke:#475569;stroke-width:2" marker-end="url(#arrow)"/>
<path d="M600 530 V560" fill="none" stroke="#f8fafc" stroke-width="9"/>
<path id="validate-ir" data-from="validation" data-to="normalize" d="M600 530 V560" class="edge" style="stroke:#475569;stroke-width:2" marker-end="url(#arrow)"/>
<path d="M600 630 V660" fill="none" stroke="#f8fafc" stroke-width="9"/>
<path id="ir-target" data-from="normalize" data-to="targets" d="M600 630 V660" class="edge" style="stroke:#475569;stroke-width:2" marker-end="url(#arrow)"/>
<path d="M600 740 V770" fill="none" stroke="#f8fafc" stroke-width="9"/>
<path id="target-output" data-from="targets" data-to="outputs" d="M600 740 V770" class="edge" style="stroke:#7c3aed;stroke-width:2" marker-end="url(#arrow)"/>
<path d="M600 870 V900" fill="none" stroke="#f8fafc" stroke-width="9"/>
<path id="output-manifest" data-from="outputs" data-to="manifest" d="M600 870 V900" class="edge" style="stroke:#7c3aed;stroke-width:2" marker-end="url(#arrow)"/>
<path d="M1100 150 H1160 V1030 H1100" fill="none" stroke="#f8fafc" stroke-width="9"/>
<path id="cli-cross" data-from="cli" data-to="cross-cut" d="M1100 150 H1160 V1030 H1100" class="edge control" style="stroke:#c2410c;stroke-width:2" marker-end="url(#arrow)"/>

<g id="sources" data-node="sources"><rect x="60" y="110" width="1080" height="80" rx="14" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
<text x="80" y="144" class="name" text-anchor="start">Authoring Sources</text>
<text x="80" y="171" class="body" text-anchor="start">Excel · CSV · JSON · YAML · HTTP API · MySQL · PostgreSQL · Google Sheets（XML / SQLite 后续）</text>
</g>
<g id="adapters" data-node="adapters"><rect x="60" y="220" width="1080" height="80" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="80" y="254" class="name" text-anchor="start">Source Adapters（cage-source-*）</text>
<text x="80" y="281" class="body" text-anchor="start">只读取解析，不做业务校验 · Schema 与 Source 解耦，同一 Schema 服务多个源</text>
</g>
<g id="canonical" data-node="canonical"><rect x="60" y="330" width="1080" height="70" rx="14" fill="#eef2ff" stroke="#a5b4fc" stroke-width="1.5"/>
<text x="80" y="364" class="name" text-anchor="start">Canonical Model（cage-core）</text>
<text x="80" y="388" class="body" text-anchor="start">统一模型 · 所有输入汇入同一类型系统</text>
</g>
<g id="validation" data-node="validation"><rect x="60" y="430" width="1080" height="100" rx="14" fill="#eef8f5" stroke="#86c9b3" stroke-width="1.5"/>
<text x="80" y="464" class="name" text-anchor="start">Validation Pipeline（八级，cage-core）</text>
<text x="80" y="495" class="body" text-anchor="start">L0 Syntax → L1 Schema → L2 Type → L3 Value → L4 Table → L5 Reference → L6 Semantic → L7 Game Rules</text>
<text x="80" y="519" class="body" text-anchor="start">跨配置引用校验：存在性 + 兼容性 · 引用谓词语义求值（不满足报 E1410）</text>
</g>
<g id="normalize" data-node="normalize"><rect x="60" y="560" width="1080" height="70" rx="14" fill="#eef2ff" stroke="#a5b4fc" stroke-width="1.5"/>
<text x="80" y="594" class="name" text-anchor="start">Normalize / IR（cage-core）</text>
<text x="80" y="618" class="body" text-anchor="start">规范化中间表示 · 数据序列化与代码生成分离</text>
</g>
<g id="targets" data-node="targets"><rect x="60" y="660" width="1080" height="80" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="80" y="694" class="name" text-anchor="start">Target Generators（cage-target-*）</text>
<text x="80" y="721" class="body" text-anchor="start">按 Profile（client / server）配置目标与字段可见性</text>
</g>
<g id="outputs" data-node="outputs">
<rect x="60" y="770" width="345" height="100" rx="14" fill="#faf5ff" stroke="#d8b4fe" stroke-width="1.5"/>
<text x="80" y="804" class="name" text-anchor="start">Data Artifacts</text>
<text x="80" y="835" class="body" text-anchor="start">JSON · CSV · MsgPack（确定性二进制）</text>
<rect x="428" y="770" width="345" height="100" rx="14" fill="#faf5ff" stroke="#d8b4fe" stroke-width="1.5"/>
<text x="448" y="804" class="name" text-anchor="start">Code Bindings</text>
<text x="448" y="835" class="body" text-anchor="start">C# · Python · Lua · TypeScript · JavaScript · C++ · Go · Java</text>
<rect x="796" y="770" width="344" height="100" rx="14" fill="#faf5ff" stroke="#d8b4fe" stroke-width="1.5"/>
<text x="816" y="804" class="name" text-anchor="start">Contracts &amp; Templates</text>
<text x="816" y="835" class="body" text-anchor="start">Protobuf .proto · FlatBuffers .fbs · JSON Schema · Template（Tera）</text>
</g>
<g id="manifest" data-node="manifest"><rect x="60" y="900" width="1080" height="70" rx="14" fill="#edf5ff" stroke="#93b9e3" stroke-width="1.5"/>
<text x="80" y="934" class="name" text-anchor="start">Manifest / Hash（确定性构建）</text>
<text x="80" y="958" class="body" text-anchor="start">同输入 → 同产物/哈希 · 可追溯 · 可回滚 · 增量</text>
</g>

<g id="cross-cut" data-node="cross-cut"><rect x="60" y="1000" width="1080" height="110" rx="14" fill="#fdf2f8" stroke="#f9a8d4" stroke-width="1.5"/>
<text x="80" y="1034" class="name" text-anchor="start">横切能力</text>
<text x="80" y="1065" class="body" text-anchor="start">CLI（cage check --level / compile / migrate / lsp）· Diagnostics 一等公民（错误码 + 定位 + 修复提示 → CLI / Web UI / IDE）</text>
<text x="80" y="1090" class="body" text-anchor="start">Profile（client / server）· 声明式数据迁移（cage migrate：rename / fill defaults / drop / widen / remap，默认 dry-run）</text>
</g>

<text x="620" y="210" class="label" text-anchor="middle">读取解析</text>
<text x="620" y="320" class="label" text-anchor="middle">入模型</text>
<text x="620" y="420" class="label" text-anchor="middle">验证</text>
<text x="620" y="550" class="label" text-anchor="middle">规范化</text>
<text x="620" y="650" class="label" text-anchor="middle">生成</text>
<text x="620" y="760" class="label" text-anchor="middle">产物</text>
<text x="620" y="890" class="label" text-anchor="middle">哈希/清单</text>
<text x="1045" y="200" class="label" text-anchor="middle" style="fill:#c2410c">横切接入 ↓</text>
<text x="40" y="1145" class="small" text-anchor="start">虚线：横切 / 控制关系（CLI、诊断、Profile、迁移）· 实线：数据流 · 14 种目标均已实现</text>
<text x="40" y="1168" class="small" text-anchor="start">图示为目标契约，以源码为准（cage-core 验证与 IR · cage-source-* 适配器 · cage-target-* 生成器）</text>
</svg>
