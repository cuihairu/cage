<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cage · Schema 编辑器</title>
<link rel="stylesheet" href="./app.css">
</head>
<body>
<header id="topbar">
  <h1>cage <span>Schema 编辑器</span></h1>
  <div id="project-meta">
    <span id="meta-project">–</span>
    <span class="divider">|</span>
    <span id="meta-path">–</span>
    <span class="divider">|</span>
    <span id="meta-profiles">–</span>
    <span id="meta-wae" hidden>| warnings 视为错误</span>
  </div>
  <div id="topbar-actions">
    <div id="mode-switch" role="tablist" aria-label="编辑模式" title="三层编辑模式共享一份 Schema 语义模型：基础=字段表单；规则=表达式规则视图；专家=原始文档（JSON）">
      <button type="button" class="mode-btn" data-mode="basic" title="字段、类型、默认值、范围、枚举、引用（无需写代码）">基础</button>
      <button type="button" class="mode-btn" data-mode="rules" title="表达式规则视图：编辑字段的 rules 数组（与基础/专家模式同一格式）">规则</button>
      <button type="button" class="mode-btn" data-mode="expert" title="直接编辑文档 JSON（Schema 语义模型的 serde 形状）；保存仍写 canonical YAML">专家</button>
    </div>
    <label class="knob">作用域
      <select id="scope-sel" title="按 profile 投影：灰显的表/字段对该 profile 不可见（targets 过滤）">
        <option value="">（全部）</option>
      </select>
    </label>
    <span id="scope-note" class="scope-note" hidden></span>
    <label class="knob" title="改动后 700ms 自动重校验（作者也可随时手动「校验」）">
      <input type="checkbox" id="auto-validate" checked> 即时重校验
    </label>
    <span id="dirty-flag" hidden>● 未保存</span>
    <button id="save-btn" type="button" class="primary" title="Ctrl/Cmd+S">保存</button>
    <button id="validate-btn" type="button" title="Ctrl/Cmd+Enter">校验</button>
    <button id="precheck-btn" type="button" title="草稿 Schema 对真实数据完整预检（与 cage check 同口径）：Ctrl/Cmd+Shift+Enter">完整预检</button>
    <a id="status-link" href="/status/">项目状态 →</a>
  </div>
</header>
<div id="layout">
  <aside id="tree">
    <div class="tree-head">
      <h2>表</h2>
      <button id="add-table" type="button" title="新增表" aria-label="新增表">＋</button>
    </div>
    <ul id="table-list"></ul>
    <div class="tree-head">
      <h2>枚举</h2>
      <button id="add-enum" type="button" title="新增枚举" aria-label="新增枚举">＋</button>
    </div>
    <ul id="enum-list"></ul>
  </aside>
  <main id="editor">
    <div id="fatal-error" hidden></div>
    <div id="empty-hint">选择左侧的表或枚举开始编辑；编辑后「校验」看 E 码诊断，「保存」写回 canonical YAML。</div>
    <div id="entity" hidden></div>
  </main>
  <aside id="diags">
    <div class="diags-head">
      <h2>诊断</h2>
      <span id="diag-count"></span>
    </div>
    <ul id="diag-list"></ul>
    <div class="diags-foot">
      「校验」= 编辑态检查：E1701（无法解析，JSON 路径定位）+ 结构一致性（E1004 族）。
      「完整预检」= 草稿 Schema 载入真实数据走 <code>cage check</code> 同一口径，
      数据侧发现标记「数据」，纯结构发现标记「结构」。
    </div>
  </aside>
</div>
<div id="diff-modal" hidden>
  <div id="diff-backdrop"></div>
  <div id="diff-panel">
    <div id="diff-head">
      <h3>保存差异预览</h3>
      <button id="diff-close" type="button" aria-label="关闭" title="关闭">×</button>
    </div>
    <div id="diff-meta"></div>
    <div id="diff-files"></div>
    <div id="diff-actions">
      <button id="diff-cancel" type="button">取消</button>
      <button id="diff-confirm" type="button" class="primary">确认保存</button>
    </div>
  </div>
</div>
<div id="toast" hidden></div>
<script type="module" src="./app.js"></script>
</body>
</html>
