[package]
name = "cage-core"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
repository = { workspace = true }
authors = { workspace = true }
categories = { workspace = true }
keywords = { workspace = true }
description = "Core types and validation pipeline for Cage configuration compiler"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
serde_path_to_error = { workspace = true }
indexmap = { workspace = true }
regex = { workspace = true }
blake3 = { workspace = true }
console = { workspace = true }
# §47 A series: deterministic bundle export/import
tar = { workspace = true }
# §47 A1: fixed-level zstd frame wrapping the deterministic tar bundle
# (`--compress zstd`); the vendored C library is pure-bundled, no system dep
zstd = { workspace = true }
# §47 A2: staging directory for untrusted bundle bytes on their way
# through the verify_snapshot trust gate (RAII cleanup)
tempfile = { workspace = true }
# Remote Source (§45): the shared HTTP GET lives here so every remote
# consumer (registry + source adapters) runs one retry policy.
ureq = { workspace = true }
# §47 A6: ed25519 detached bundle signatures (export --sign / import
# --verify-sig) + keygen; keys travel as env-var bytes only
ed25519-dalek = { workspace = true }
rand_core = { workspace = true }
base64 = { workspace = true }

