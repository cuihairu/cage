# 道具表（源：sources/Item.csv）
tables:
  Item:
    name: Item
    description: 道具表（CSV 源；type/rarity 双枚举；price 非负）
    primary_key: [id]
    unique_constraints:
      - name: name_unique
        fields: [name]
    fields:
      id: { name: id, type: { kind: Int32 }, required: true, min: 1 }
      name: { name: name, type: { kind: String }, required: true, min_length: 1, max_length: 64 }
      type:
        name: type
        type: { kind: Enum, value: ItemType }
        required: true
      rarity:
        name: rarity
        type: { kind: Enum, value: Rarity }
        required: true
      price: { name: price, type: { kind: Int32 }, required: true, min: 0, max: 999999 }
enums:
  ItemType:
    name: ItemType
    description: 道具类型（整型枚举）
    values:
      - { name: Weapon, value: 1 }
      - { name: Armor, value: 2 }
      - { name: Consumable, value: 3 }
  Rarity:
    name: Rarity
    description: 稀有度（字符串枚举）
    values:
      - { name: common }
      - { name: rare }
      - { name: epic }
      - { name: legendary }
