# 坏数据示例：与上层工程共用同一份 schema，只把 Character.csv 的第一行
# attack 改成 500（level=1 → power_curve 上限 150）→ 触发 L7 E1601 行级诊断。
output_dir = "build"
schema_path = "../schemas"

[project]
name = "rpg-demo-bad"
version = "0.1.0"
description = "Cage 坏数据示例：attack 越过 power curve → E1601"

[source_roots]
main = "config"

# 与上层工程同一份元行约定：复制过来的 Skill.xlsx 的 ## 元行需要
# marker_rows 档解码（skill.yaml 在共享的 ../schemas 里被一起采用）。
[source.excel]
preset = "data"
workbooks = { "Skill.xlsx" = "marker_rows" }

[profiles.client]
name = "client"
targets = []

# 显式选包（P3-1）：power_curve 是内置样例规则包，通用工程默认不套用游戏数值
# 曲线——选中才在 L7 运行，且选中即强制 L7 关卡。默认参数 level * 100 + 50，
# 首行 attack=500 越过 level=1 的上限 150 → E1601 行级诊断。
[validation]
rule_packages = ["power_curve"]
